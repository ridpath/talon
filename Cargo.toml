[package]
name = "talon"
version = "0.1.0"
edition = "2021"
autoexamples = false

[dependencies]
# Core Parsing
pest = "2.7"
pest_derive = "2.7"

# LLVM & Codegen (optional - not needed for CTF modules)
inkwell = { version = "0.2", features = ["llvm16-0"], optional = true }
walrus = "0.25"

# Web3 / Blockchain
web3 = { version = "0.19", features = ["http-rustls-tls"] }
ethabi = "18.0"
tokio = { version = "1.37", features = ["full"] }
futures = "0.3"

# Crypto / Encoding
aes-gcm = "0.10"
sha2 = "0.10"
base64 = "0.13"
hex = "0.4"
rand = "0.8"
secp256k1 = "0.27"
bip39 = "2.0"
hkdf = "0.12"
pbkdf2 = "0.11"
ed25519-dalek = "2.1"
bincode = "1.3"

# Binary Analysis
capstone = "0.12"
keystone-engine = { version = "0.1", optional = true }
yara = { version = "0.25", optional = true }
pelite = "0.10"
goblin = "0.7"
statrs = "0.16"
z3 = { version = "0.19", features = ["static-link-z3"], optional = true }

# Threads / IO
byteorder = "1.5"
reqwest = { version = "0.11", features = ["blocking", "json"] }
nix = "0.27"
libc = "0.2"
walkdir = "2.4"
tempfile = "3.9"
glob = "0.3"

# Shell / PTY
portable-pty = "0.8"
ssh2 = "0.9"

# JSON / Logging
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_bytes = "0.11"
log = "0.4"
env_logger = "0.10"
colored = "2.1"

# LSP (optional - for IDE integration)
tower-lsp = { version = "0.20", optional = true }

# Optional CLI utility for future tooling
clap = { version = "4.5", features = ["derive"] }

# CTF/PENTESTING DEPENDENCIES
# Web exploitation
urlencoding = "2.1"

# Cryptography & hashing
md5 = "0.7"
sha1 = "0.10"

# Regular expressions for pattern matching
regex = "1.10"

# Archive manipulation
zip = "0.6"
flate2 = "1.0"

# UX Enhancements
indicatif = "0.17"
toml = "0.8"
directories = "5.0"
dirs = "5.0"
rustyline = "13.0"
chrono = "0.4"
lazy_static = "1.4"
arboard = "3.4"
crossterm = "0.27"
ctrlc = "3.4"
phf = { version = "0.11", features = ["macros"] }
crossbeam = "0.8"
dashmap = "5.5"

# GAME HACKING & EXPLOITATION (Phase 12)
sysinfo = "0.30"
windows = { version = "0.52", features = ["Win32_System_Diagnostics_Debug", "Win32_System_Memory", "Win32_System_Threading", "Win32_Foundation", "Win32_System_LibraryLoader"], optional = true }
mach2 = { version = "0.4", optional = true }
procfs = { version = "0.15", optional = true }
retour = { version = "0.3", optional = true }

# FORENSICS & ANTI-SANDBOX (Phase 5.5)
# eBPF support (aya crate) can be added as optional feature in future
# Requires: aya = { version = "0.11", optional = true }
# Current implementation provides interface stubs ready for aya integration

# DISTRIBUTED SWARM (Phase 6)
tonic = { version = "0.11", features = ["tls"], optional = true }
prost = { version = "0.12", optional = true }
chacha20poly1305 = "0.10"
uuid = { version = "1.6", features = ["v4", "serde"] }
thiserror = "1.0"
hostname = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
redis = { version = "0.24", optional = true }
tokio-postgres = { version = "0.7", optional = true }

[build-dependencies]
tonic-build = { version = "0.11", optional = true }
which = "6.0"
phf_codegen = "0.11"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
proptest = "1.4"

[[bench]]
name = "connection_registry_bench"
harness = false

[features]
default = []
llvm = ["inkwell"]
lsp-server = ["tower-lsp"]
malware-analysis = ["yara"]
binary-patching = ["keystone-engine"]
symbolic-execution = ["z3"]
game-hacking = ["retour"]
game-hacking-windows = ["windows", "game-hacking"]
game-hacking-linux = ["procfs", "game-hacking"]
game-hacking-macos = ["mach2", "game-hacking"]
swarm = ["tonic", "prost", "tonic-build"]
redis = ["dep:redis"]
postgres = ["tokio-postgres"]

[[bin]]
name = "talon"
path = "src/main.rs"

[[bin]]
name = "talon-agent"
path = "src/bin/agent.rs"
required-features = ["swarm"]

# Profile optimizations for static builds
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.release-small]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
