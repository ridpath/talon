[package]
name = "talon"
version = "0.1.0"
edition = "2021"

[dependencies]
# Core Parsing
pest = "2.7"
pest_derive = "2.7"

# LLVM & Codegen (optional - not needed for CTF modules)
inkwell = { version = "0.2", features = ["llvm16-0"], optional = true }
walrus = "0.20"

# Web3 / Blockchain
web3 = { version = "0.19", features = ["http-rustls-tls"] }
ethabi = "18.0"
tokio = { version = "1.37", features = ["full"] }
futures = "0.3"

# Crypto / Encoding
aes-gcm = "0.10"
sha2 = "0.10"
base64 = "0.13"
hex = "0.4"
rand = "0.8"
secp256k1 = "0.31"
bip39 = "2.0"
hkdf = "0.12"
pbkdf2 = "0.12"

# Binary Analysis
capstone = "0.12"
yara = { version = "0.25", optional = true }
pelite = "0.10"
goblin = "0.7"
statrs = "0.16"

# Threads / IO
byteorder = "1.5"
reqwest = { version = "0.11", features = ["blocking", "json"] }
nix = "0.27"
libc = "0.2"
walkdir = "2.4"
tempfile = "3.9"
glob = "0.3"

# Shell / PTY
portable-pty = "0.8"

# JSON / Logging
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.10"
colored = "2.1"

# LSP
tower-lsp = "0.20"

# Optional CLI utility for future tooling
clap = { version = "4.5", features = ["derive"] }

# CTF/PENTESTING DEPENDENCIES
# Web exploitation
urlencoding = "2.1"

# Cryptography & hashing
md5 = "0.8"
sha1 = "0.10"

# Regular expressions for pattern matching
regex = "1.10"

# Archive manipulation
zip = "0.6"
flate2 = "1.0"

# UX Enhancements
indicatif = "0.17"
toml = "0.8"
directories = "5.0"
rustyline = "13.0"
chrono = "0.4"
lazy_static = "1.4"

# GAME HACKING & EXPLOITATION (Phase 12)
sysinfo = "0.30"
windows = { version = "0.52", features = ["Win32_System_Diagnostics_Debug", "Win32_System_Memory", "Win32_System_Threading", "Win32_Foundation"], optional = true }
mach2 = { version = "0.4", optional = true }
procfs = { version = "0.15", optional = true }
retour = { version = "0.3", optional = true }

[dev-dependencies]
# Property-based testing
proptest = "1.4"
quickcheck = "1.0"
quickcheck_macros = "1.0"

# Benchmarking
criterion = { version = "0.5", features = ["html_reports"] }

# Mocking
mockall = "0.12"

# CLI testing
assert_cmd = "2.0"
predicates = "3.0"

# Better test assertions
pretty_assertions = "1.4"

# Serial test execution
serial_test = "3.0"

# Additional test utilities
rstest = "0.18"
insta = "1.34"

# Timeout support for tests
wait-timeout = "0.2"

[features]
default = []
llvm = ["inkwell"]
malware-analysis = ["yara"]
game-hacking = ["retour"]
game-hacking-windows = ["windows", "game-hacking"]
game-hacking-linux = ["procfs", "game-hacking"]
game-hacking-macos = ["mach2", "game-hacking"]
test-utils = []

[profile.test]
opt-level = 1
debug = true
overflow-checks = true

[profile.bench]
opt-level = 3
debug = false
lto = "thin"
codegen-units = 1

# Disabled pending API updates
# [[bench]]
# name = "rop_bench"
# harness = false

[[bench]]
name = "parser_bench"
harness = false

# Disabled pending interpreter API
# [[bench]]
# name = "interpreter_bench"
# harness = false

