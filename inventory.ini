# TALON Swarm Agent Inventory
# Format: hostname endpoint [key=value metadata]
# Groups defined in square brackets [group_name]
#
# Metadata keys:
#   os=linux|windows|macos       - Operating system
#   arch=x86_64|aarch64|armv7    - CPU architecture
#   tag=<tag>                     - Custom tag for filtering
#   cap=<capability>              - Agent capability
#
# Capabilities:
#   - binary_analysis: Can analyze ELF/PE binaries
#   - network_exploit: Can perform network-based exploitation
#   - rop_chain: Can generate ROP chains
#   - heap_analysis: Can analyze heap structures
#   - kernel_exploit: Can perform kernel exploitation
#   - web_exploit: Can perform web application testing
#   - crypto_analysis: Can analyze cryptographic primitives
#   - forensics: Can perform memory/disk forensics
#
# Example Usage:
#   talon swarm deploy inventory.ini
#   talon swarm run exploit.talon --agents-from inventory.ini
#   talon swarm status
#   talon swarm results

# Production exploitation environment
[production]
exploit-prod-01 10.0.1.10:50052 os=linux arch=x86_64 tag=production cap=binary_analysis cap=network_exploit
exploit-prod-02 10.0.1.11:50052 os=linux arch=x86_64 tag=production cap=rop_chain cap=heap_analysis
exploit-prod-03 10.0.1.12:50052 os=linux arch=aarch64 tag=production tag=arm cap=binary_analysis cap=kernel_exploit
exploit-prod-04 10.0.1.13:50052 os=linux arch=x86_64 tag=production cap=crypto_analysis
exploit-prod-05 10.0.1.14:50052 os=windows arch=x86_64 tag=production tag=windows cap=binary_analysis cap=network_exploit

