name: Integration Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  integration-tests:
    name: Integration Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        rust: [stable]
        
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
          
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          
      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config
          
      - name: Build library
        run: cargo build --lib --all-features
        
      - name: Run unit tests
        run: cargo test --lib --all-features --no-fail-fast -- --test-threads=1
        timeout-minutes: 30
        
      - name: Run integration tests
        run: cargo test --test '*' --all-features --no-fail-fast -- --test-threads=1
        timeout-minutes: 45
        
      - name: Run doctests
        run: cargo test --doc --all-features --no-fail-fast
        timeout-minutes: 15

  exploit-chain-tests:
    name: Exploit Chain Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Run exploit chain integration tests
        run: cargo test --test exploit_chain_test --all-features --no-fail-fast
        timeout-minutes: 20

  ssh-tests:
    name: SSH Exploitation Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Install OpenSSH server
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server
          sudo systemctl start ssh
          
      - name: Run SSH integration tests
        run: cargo test --test ssh_exploitation_test --all-features --no-fail-fast
        timeout-minutes: 15
        continue-on-error: true  # SSH tests may fail in CI

  binary-patching-tests:
    name: Binary Patching Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Run binary patching tests
        run: cargo test --test binary_patching_test --all-features --no-fail-fast
        timeout-minutes: 15

  oracle-tests:
    name: Vulnerability Detection Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Run oracle vulnerability detection tests
        run: cargo test --test oracle_vuln_detection_test --all-features --no-fail-fast
        timeout-minutes: 20

  rop-mitigation-tests:
    name: ROP and Mitigation Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Run ROP and mitigation tests
        run: cargo test --test rop_and_mitigation_test --all-features --no-fail-fast
        timeout-minutes: 20

  time-travel-tests:
    name: Time-Travel Debugging Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Install GDB
        run: |
          sudo apt-get update
          sudo apt-get install -y gdb
          
      - name: Run time-travel debugging tests
        run: cargo test --test time_travel_debugging_test --all-features --no-fail-fast
        timeout-minutes: 20

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Install tarpaulin
        run: cargo install cargo-tarpaulin
        
      - name: Generate coverage
        run: |
          cargo tarpaulin --all-features --workspace --timeout 600 --out Xml --output-dir ./coverage
        timeout-minutes: 60
        continue-on-error: true
        
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/cobertura.xml
          fail_ci_if_error: false
        continue-on-error: true
        
      - name: Check coverage threshold
        run: |
          if [ -f ./coverage/cobertura.xml ]; then
            coverage=$(grep -oP 'line-rate="\K[0-9.]+' ./coverage/cobertura.xml | head -1)
            coverage_percent=$(echo "$coverage * 100" | bc)
            echo "Coverage: $coverage_percent%"
            if (( $(echo "$coverage < 0.70" | bc -l) )); then
              echo "Coverage $coverage_percent% is below 70% threshold"
              exit 1
            fi
          fi
        continue-on-error: true

  clippy:
    name: Clippy Lints
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          
      - name: Run clippy
        run: cargo clippy --all-features --all-targets -- -D warnings
        continue-on-error: true  # Don't fail CI on clippy warnings

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          
      - name: Check formatting
        run: cargo fmt --all -- --check

  build-success:
    name: All Tests Passed
    runs-on: ubuntu-latest
    needs: 
      - integration-tests
      - exploit-chain-tests
      - binary-patching-tests
      - oracle-tests
      - rop-mitigation-tests
      - time-travel-tests
      - fmt
      
    steps:
      - name: Success
        run: echo "All integration tests passed successfully!"
