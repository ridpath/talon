name: TALON Static Binary Build Matrix

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

jobs:
  build-matrix:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x64 musl (static, <50MB target)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact_name: talon-linux-x64
            features: ""
            cross: true
            
          # Linux ARM64 musl (static)
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact_name: talon-linux-arm64
            features: ""
            cross: true
            
          # Windows x64 MSVC (static CRT)
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: talon-windows-x64.exe
            features: ""
            cross: false
            
          # Windows x86 MSVC (static CRT)
          - os: windows-latest
            target: i686-pc-windows-msvc
            artifact_name: talon-windows-x86.exe
            features: ""
            cross: false
            
          # macOS x64 (Intel)
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: talon-macos-x64
            features: ""
            cross: false
            
          # macOS ARM64 (Apple Silicon)
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: talon-macos-arm64
            features: ""
            cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          
      - name: Install cross-compilation tools (Linux)
        if: matrix.cross && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools musl-dev
          
          # Install cross for ARM cross-compilation
          cargo install cross --git https://github.com/cross-rs/cross
          
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev \
            pkg-config \
            build-essential \
            libcapstone-dev \
            protobuf-compiler
            
      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install capstone protobuf
          
      - name: Install build dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          # Install protoc for Windows
          choco install protoc -y
          
      - name: Cache Cargo registry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-
            
      - name: Cache Cargo build
        uses: actions/cache@v3
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-build-
            
      - name: Build binary (cross-compilation)
        if: matrix.cross
        run: |
          cross build --release --target ${{ matrix.target }} ${{ matrix.features }}
          
      - name: Build binary (native)
        if: "!matrix.cross"
        run: |
          cargo build --release --target ${{ matrix.target }} ${{ matrix.features }}
          
      - name: Strip binary (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          strip target/${{ matrix.target }}/release/talon || true
          
      - name: Verify binary size (Linux)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          SIZE=$(stat -c%s target/${{ matrix.target }}/release/talon)
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "Binary size: ${SIZE_MB}MB"
          
          if [ $SIZE_MB -gt 50 ]; then
            echo "WARNING: Binary size exceeds 50MB target (${SIZE_MB}MB)"
          else
            echo "Binary size within 50MB target"
          fi
          
      - name: Test binary dependencies (Linux musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          # Verify static linking (should show no dynamic dependencies except linux-vdso and ld-linux)
          echo "=== Checking dynamic dependencies ==="
          ldd target/${{ matrix.target }}/release/talon || echo "Statically linked (expected)"
          
          # Verify binary works
          echo "=== Testing binary execution ==="
          target/${{ matrix.target }}/release/talon --version
          
      - name: Test binary execution (Windows)
        if: runner.os == 'Windows'
        run: |
          target\${{ matrix.target }}\release\talon.exe --version
          
      - name: Test binary execution (macOS)
        if: runner.os == 'macOS'
        run: |
          target/${{ matrix.target }}/release/talon --version
          
      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p artifacts
          
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/${{ matrix.target }}/release/talon.exe artifacts/${{ matrix.artifact_name }}
          else
            cp target/${{ matrix.target }}/release/talon artifacts/${{ matrix.artifact_name }}
          fi
          
          # Generate checksums
          cd artifacts
          if command -v sha256sum &> /dev/null; then
            sha256sum ${{ matrix.artifact_name }} > ${{ matrix.artifact_name }}.sha256
          elif command -v shasum &> /dev/null; then
            shasum -a 256 ${{ matrix.artifact_name }} > ${{ matrix.artifact_name }}.sha256
          fi
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: artifacts/${{ matrix.artifact_name }}
          retention-days: 30
          
      - name: Upload checksum
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}.sha256
          path: artifacts/${{ matrix.artifact_name }}.sha256
          retention-days: 30

  # Create macOS universal binary (x64 + ARM64)
  macos-universal:
    name: macOS Universal Binary
    runs-on: macos-latest
    needs: build-matrix
    
    steps:
      - name: Download x64 binary
        uses: actions/download-artifact@v4
        with:
          name: talon-macos-x64
          path: ./bin-x64
          
      - name: Download ARM64 binary
        uses: actions/download-artifact@v4
        with:
          name: talon-macos-arm64
          path: ./bin-arm64
          
      - name: Create universal binary
        run: |
          mkdir -p artifacts
          lipo -create \
            bin-x64/talon-macos-x64 \
            bin-arm64/talon-macos-arm64 \
            -output artifacts/talon-macos-universal
          
          chmod +x artifacts/talon-macos-universal
          
          # Verify universal binary
          lipo -info artifacts/talon-macos-universal
          
          # Test execution
          artifacts/talon-macos-universal --version
          
          # Generate checksum
          shasum -a 256 artifacts/talon-macos-universal > artifacts/talon-macos-universal.sha256
          
      - name: Upload universal binary
        uses: actions/upload-artifact@v4
        with:
          name: talon-macos-universal
          path: artifacts/talon-macos-universal
          retention-days: 30
          
      - name: Upload universal checksum
        uses: actions/upload-artifact@v4
        with:
          name: talon-macos-universal.sha256
          path: artifacts/talon-macos-universal.sha256
          retention-days: 30

  # Verification job - test static binaries on clean systems
  verify-static:
    name: Verify Static Binaries
    runs-on: ubuntu-latest
    needs: build-matrix
    container:
      # Use Alpine (minimal libc) to verify static linking
      image: alpine:latest
      
    steps:
      - name: Download Linux x64 musl binary
        uses: actions/download-artifact@v4
        with:
          name: talon-linux-x64
          path: ./
          
      - name: Verify static binary on Alpine
        run: |
          chmod +x talon-linux-x64
          
          # Alpine has no glibc - this verifies musl static linking
          echo "=== Testing on Alpine (no glibc) ==="
          ./talon-linux-x64 --version
          
          # Check for dynamic dependencies
          echo "=== Checking dependencies ==="
          ldd talon-linux-x64 || echo "Statically linked (expected on musl)"
          
          # Verify size
          SIZE=$(stat -c%s talon-linux-x64)
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "Binary size: ${SIZE_MB}MB"
          
          if [ $SIZE_MB -gt 50 ]; then
            echo "WARNING: Binary exceeds 50MB target"
          fi

  # Create release if tagged
  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [build-matrix, macos-universal]
    permissions:
      contents: write
      
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          
      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
