name: Continuous Fuzzing

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      duration:
        description: 'Fuzzing duration in seconds (default: 300)'
        required: false
        default: '300'
      target:
        description: 'Specific fuzz target to run (optional, runs all if empty)'
        required: false
        default: ''

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fuzz:
    name: Fuzz Testing
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        target:
          - fuzz_parser
          - fuzz_elf_parser
          - fuzz_pe_parser
          - fuzz_shellcode_generator
          - fuzz_format_string
          - fuzz_heap_tools
          - fuzz_packing_tools
          - fuzz_rop_gadget_finder
          - fuzz_rop_chain_builder
          - fuzz_auto_solver
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          components: rustfmt, clippy

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Cache Rust dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-fuzz-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-fuzz-

      - name: Run fuzzer
        timeout-minutes: 10
        run: |
          DURATION=${{ github.event.inputs.duration || '300' }}
          TARGET=${{ matrix.target }}
          
          if [ -n "${{ github.event.inputs.target }}" ] && [ "$TARGET" != "${{ github.event.inputs.target }}" ]; then
            echo "Skipping $TARGET (not the requested target)"
            exit 0
          fi
          
          echo "Running fuzzer: $TARGET for ${DURATION}s"
          cargo +nightly fuzz run $TARGET -- -max_total_time=$DURATION -print_final_stats=1 || {
            EXIT_CODE=$?
            echo "Fuzzer exited with code: $EXIT_CODE"
            
            if [ -d "fuzz/artifacts/$TARGET" ]; then
              echo "=== Crash artifacts found ==="
              ls -lh fuzz/artifacts/$TARGET/
              
              for crash in fuzz/artifacts/$TARGET/crash-*; do
                if [ -f "$crash" ]; then
                  echo "--- Content of $crash (first 500 bytes) ---"
                  hexdump -C "$crash" | head -n 30
                fi
              done
            fi
            
            exit $EXIT_CODE
          }

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          retention-days: 30

      - name: Generate fuzzing report
        if: always()
        run: |
          echo "# Fuzzing Report: ${{ matrix.target }}" > fuzzing_report.md
          echo "" >> fuzzing_report.md
          echo "- **OS**: ${{ matrix.os }}" >> fuzzing_report.md
          echo "- **Target**: ${{ matrix.target }}" >> fuzzing_report.md
          echo "- **Duration**: ${{ github.event.inputs.duration || '300' }}s" >> fuzzing_report.md
          echo "" >> fuzzing_report.md
          
          if [ -d "fuzz/artifacts/${{ matrix.target }}" ]; then
            CRASH_COUNT=$(ls fuzz/artifacts/${{ matrix.target }}/crash-* 2>/dev/null | wc -l)
            echo "- **Crashes found**: $CRASH_COUNT" >> fuzzing_report.md
          else
            echo "- **Crashes found**: 0" >> fuzzing_report.md
          fi
          
          cat fuzzing_report.md

      - name: Upload fuzzing report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: fuzzing-report-${{ matrix.target }}
          path: fuzzing_report.md

  coverage:
    name: Fuzzing Coverage Summary
    runs-on: ubuntu-latest
    needs: fuzz
    if: always()
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all reports
        uses: actions/download-artifact@v3
        with:
          path: reports/

      - name: Generate summary
        run: |
          echo "# Fuzzing Campaign Summary" > FUZZING_SUMMARY.md
          echo "" >> FUZZING_SUMMARY.md
          echo "**Date**: $(date)" >> FUZZING_SUMMARY.md
          echo "" >> FUZZING_SUMMARY.md
          
          TOTAL_CRASHES=0
          
          for report in reports/fuzzing-report-*/fuzzing_report.md; do
            if [ -f "$report" ]; then
              echo "---" >> FUZZING_SUMMARY.md
              cat "$report" >> FUZZING_SUMMARY.md
              echo "" >> FUZZING_SUMMARY.md
              
              CRASHES=$(grep "Crashes found:" "$report" | grep -oP '\d+' || echo "0")
              TOTAL_CRASHES=$((TOTAL_CRASHES + CRASHES))
            fi
          done
          
          echo "---" >> FUZZING_SUMMARY.md
          echo "## Total Crashes Found: $TOTAL_CRASHES" >> FUZZING_SUMMARY.md
          
          cat FUZZING_SUMMARY.md

      - name: Upload summary
        uses: actions/upload-artifact@v3
        with:
          name: fuzzing-summary
          path: FUZZING_SUMMARY.md

  quick-smoke-test:
    name: Quick Smoke Test (5min)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Run quick fuzz (parser only)
        timeout-minutes: 6
        run: |
          cargo +nightly fuzz run fuzz_parser -- -max_total_time=300 -print_final_stats=1

      - name: Check for crashes
        if: failure()
        run: |
          if [ -d "fuzz/artifacts/fuzz_parser" ]; then
            echo "CRITICAL: Parser fuzzer found crashes!"
            ls -lh fuzz/artifacts/fuzz_parser/
            exit 1
          fi
