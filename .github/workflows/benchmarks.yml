name: Benchmarks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    name: Run Benchmarks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        rust: [stable]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-
      
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-git-
      
      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-target-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-target-bench-
      
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcapstone-dev
      
      - name: Run parser benchmarks
        run: cargo bench --bench parser_bench -- --output-format bencher | tee parser_bench_output.txt
      
      - name: Run interpreter benchmarks
        run: cargo bench --bench interpreter_bench -- --output-format bencher | tee interpreter_bench_output.txt
      
      - name: Run binary analysis benchmarks
        run: cargo bench --bench binary_analysis_bench -- --output-format bencher | tee binary_analysis_bench_output.txt
      
      - name: Run ROP tools benchmarks
        run: cargo bench --bench rop_bench -- --output-format bencher | tee rop_bench_output.txt
      
      - name: Generate benchmark summary
        shell: bash
        run: |
          echo "# Benchmark Results - ${{ matrix.os }}" > benchmark_summary.md
          echo "" >> benchmark_summary.md
          echo "## Parser Benchmarks" >> benchmark_summary.md
          echo '```' >> benchmark_summary.md
          cat parser_bench_output.txt | grep "test" | head -20 >> benchmark_summary.md
          echo '```' >> benchmark_summary.md
          echo "" >> benchmark_summary.md
          echo "## Interpreter Benchmarks" >> benchmark_summary.md
          echo '```' >> benchmark_summary.md
          cat interpreter_bench_output.txt | grep "test" | head -20 >> benchmark_summary.md
          echo '```' >> benchmark_summary.md
          echo "" >> benchmark_summary.md
          echo "## Binary Analysis Benchmarks" >> benchmark_summary.md
          echo '```' >> benchmark_summary.md
          cat binary_analysis_bench_output.txt | grep "test" | head -20 >> benchmark_summary.md
          echo '```' >> benchmark_summary.md
          echo "" >> benchmark_summary.md
          echo "## ROP Tools Benchmarks" >> benchmark_summary.md
          echo '```' >> benchmark_summary.md
          cat rop_bench_output.txt | grep "test" | head -20 >> benchmark_summary.md
          echo '```' >> benchmark_summary.md
      
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ matrix.os }}
          path: |
            parser_bench_output.txt
            interpreter_bench_output.txt
            binary_analysis_bench_output.txt
            rop_bench_output.txt
            benchmark_summary.md
            target/criterion/
      
      - name: Comment benchmark results on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('benchmark_summary.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
  
  baseline:
    name: Store Baseline
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    needs: benchmark
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download benchmark results
        uses: actions/download-artifact@v4
        with:
          name: benchmark-results-ubuntu-latest
          path: benchmark-results
      
      - name: Store baseline
        run: |
          mkdir -p .github/benchmark-baselines
          cp benchmark-results/*.txt .github/benchmark-baselines/
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .github/benchmark-baselines/
          git commit -m "Update benchmark baselines [skip ci]" || echo "No changes to commit"
          git push || echo "No changes to push"
