name: TALON CI Suite

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  talon-ci:
    name: Build, Test, Fuzz, and Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      RUST_BACKTRACE: full
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config build-essential

      - name: Build TALON
        run: cargo build --release

      - name: Run all tests
        run: cargo test --all-features -- --nocapture

      - name: Install fuzzing tools
        run: |
          rustup install nightly
          rustup default nightly
          cargo install cargo-fuzz

      - name: Run fuzz targets (5 min each)
        run: |
          if [ -d fuzz/fuzz_targets ]; then
            FUZZ_TARGETS=$(ls fuzz/fuzz_targets | sed 's/\.rs//')
            for TARGET in $FUZZ_TARGETS; do
              echo "Running fuzz target: $TARGET"
              cargo +nightly fuzz run $TARGET -- -max_total_time=300 || exit 1
            done
          else
            echo "No fuzz targets found — skipping fuzz step."
          fi

      - name: Install code coverage tool
        run: cargo install cargo-tarpaulin

      - name: Run code coverage
        run: |
          cargo tarpaulin --out Html --all-features
          echo "Coverage run complete."

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: tarpaulin-report.html
