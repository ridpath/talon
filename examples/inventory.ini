# TALON Swarm Agent Inventory
# Format: hostname endpoint [key=value ...]
#
# Supported keys:
#   os=<linux|windows|macos>    - Operating system
#   arch=<x86_64|aarch64|i686>  - Architecture
#   tag=<tag_name>              - Grouping tags
#   cap=<capability>            - Agent capabilities
#
# Capabilities:
#   - binary_analysis: Static/dynamic binary analysis
#   - network_exploit: Network-based exploitation
#   - rop_chain: ROP chain generation
#   - heap_exploit: Heap exploitation
#   - kernel_exploit: Kernel-level exploitation
#   - web_exploit: Web application exploitation

# Production environment
[production]
web-server-01 https://10.0.1.100:50051 os=linux arch=x86_64 tag=web cap=network_exploit cap=binary_analysis
db-server-01 https://10.0.1.101:50051 os=linux arch=x86_64 tag=database cap=network_exploit
app-server-01 https://10.0.1.102:50051 os=linux arch=x86_64 tag=app cap=network_exploit cap=heap_exploit

# Staging environment
[staging]
staging-01 https://10.0.2.100:50051 os=linux arch=x86_64 tag=testing cap=binary_analysis cap=rop_chain
staging-02 https://10.0.2.101:50051 os=linux arch=x86_64 tag=testing cap=network_exploit
staging-03 https://10.0.2.102:50051 os=linux arch=aarch64 tag=testing cap=binary_analysis

# Development environment
[development]
dev-workstation-01 https://192.168.1.100:50051 os=linux arch=x86_64 tag=dev cap=binary_analysis cap=rop_chain cap=heap_exploit
dev-workstation-02 https://192.168.1.101:50051 os=windows arch=x86_64 tag=dev cap=network_exploit cap=web_exploit
dev-workstation-03 https://192.168.1.102:50051 os=macos arch=aarch64 tag=dev cap=binary_analysis

# CTF competition environment
[ctf]
ctf-pwn-01 https://ctf.example.com:50051 os=linux arch=x86_64 tag=ctf cap=binary_analysis cap=rop_chain cap=heap_exploit cap=kernel_exploit
ctf-web-01 https://ctf.example.com:50052 os=linux arch=x86_64 tag=ctf cap=web_exploit cap=network_exploit
ctf-crypto-01 https://ctf.example.com:50053 os=linux arch=x86_64 tag=ctf cap=binary_analysis

# High-performance analysis cluster
[analysis]
cluster-node-01 https://10.0.10.1:50051 os=linux arch=x86_64 tag=cluster cap=binary_analysis cap=rop_chain
cluster-node-02 https://10.0.10.2:50051 os=linux arch=x86_64 tag=cluster cap=binary_analysis cap=rop_chain
cluster-node-03 https://10.0.10.3:50051 os=linux arch=x86_64 tag=cluster cap=binary_analysis cap=rop_chain
cluster-node-04 https://10.0.10.4:50051 os=linux arch=x86_64 tag=cluster cap=binary_analysis cap=rop_chain

# Special-purpose agents
[special]
arm-exploit-lab https://10.0.20.1:50051 os=linux arch=aarch64 tag=arm cap=binary_analysis cap=rop_chain cap=heap_exploit
mips-exploit-lab https://10.0.20.2:50051 os=linux arch=mips64 tag=mips cap=binary_analysis cap=rop_chain
windows-lab https://10.0.20.3:50051 os=windows arch=x86_64 tag=windows cap=network_exploit cap=binary_analysis

# Usage Examples:
#
# Deploy agents from inventory:
#   talon swarm deploy inventory.ini
#
# Execute script on all agents:
#   talon swarm run exploit.talon --agents-from inventory.ini
#
# Check agent status:
#   talon swarm status
#
# View execution results:
#   talon swarm results <script-id>
